<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fish Cinema</title>
  <meta name="description" content="Смотри лучшие фильмы онлайн на Fish Cinema">
  <link rel="icon" href="favicon.png">
  <style>
    body { background-color: #141414; color: #fff; font-family: sans-serif; }
    .movie-card {
      background-color: #222;
      padding: 20px;
      width: 250px;
      border-radius: 10px;
      border: 2px solid #e50914;
    }
    .btn-watch {
      background-color: #e50914;
      color: #fff;
      border: none;
      padding: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="movie-card">
    <h2 class="movie-title">Веном 3</h2>
    <p class="movie-info">Год: 2024 | Жанр: Экшн, Фантастика</p>
    <button class="btn-watch">Смотреть</button>
  </div>

  <script>
    document.querySelector('.btn-watch').addEventListener('click', () => {
      alert('Плеер загружается! Приятного просмотра.');
    });
  </script>
</body>
</html>
