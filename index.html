<!DOCTYPE html>
<html lang="uk">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Мой величайший киносайт Fish Cinema</title>
     
  <body>
  <div class="movie-card">
       <h2 class="movie-title">Веном 3</h2>
       <p class="movie-info">Год: 2024 | Жанр: Екшн, Фантастика</p>
         <button class="btn-watch" onclick="showMessage()">Смотреть</button>
  </div>
  <style>
       body {
            background-color: #141414;
            color: #ffffff;
            font-family: sans-serif;
       }
       .movie-card {
                  background-color: #222222;
                  padding:20px;
                  width:250px;
                  border-radius:10px;
                  border: 2px solid #e50914;
              }
              .btn-watch {
                  background-color: #e50914;
                  color: white;
                  border: none;
                  padding:10px;
                  cursor: pointer;
               }
    </style>
</head>
  <script>
  function showMessage() {
       alert("Плеер загружаеться! Приятного просмотра.");
       }
</script>

</body>
</html>
