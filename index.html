<!DOCTYPE html>
     <html lang="ru">
          <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">        
<title>Fish Cinema</title>               
<style>
  * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
  }
     body
     background: #16120c;
     color: #e8dcc8;
     font-family: Georgia, serif;
     padding: 30px;
     }
     header {
          text-align: center;
          margin-bottom: 36px;
          padding-bottomm: 20px;
          border bottom: 1px solid #8a7040;
     }
     header h1 {
          color: #c9a84c;
          font-size: 2.5rem;
          margin-bottom: 8px;
     }
     header p {
          color: #c4aa88;
          font-style: italic;
     }
     /* сетка карточек */
     .movies-grib {
          display: grib;
          grib-template-columns: repeat(auto-fill, minmax(180px, 1fr));
          gap: 24px;
          max-width: 1100px;
          margin: 0 auto;
     }
          
     
          
          
     
               
</body>
</html>
