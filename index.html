<!DOCTYPE html>
     <html lang="ru">
          <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">        
<title>Fish Cinema</title>               
<style>
  * {
       box-sizing: border-box;
       margin: 0;
       padding: 0;
  }
     body {
     background: #16120c;
     color: #e8dcc8;
     font-family: Georgia, serif;
     padding: 30px;
     }
     header {
          text-align: center;
          margin-bottom: 36px;
          padding-bottom: 20px;
          border-bottom: 1px solid #8a7040;
     }
     header h1 {
          color: #c9a84c;
          font-size: 2.5rem;
          margin-bottom: 8px;
     }
     header p {
          color: #c4aa88;
          font-style: italic;
     }
     /* сетка карточек */
     .movies-grid {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
          gap: 24px;
          max-width: 1100px;
          margin: 0 auto;
     }
          /* одна карточка */
     .movie-card {
          background: #1e1810;
          border: 1px solid #8a7040;
          padding: 10px;
          transition: transform 0.25s, border-color 0.25s; 
     }
     .movir-card: hover {
          transform: translateY(-6px);
          border-color: #c9a84c;
     }
     .movie-card a {
          text-decoration: none;
          color: inherit;
     }
     .movie-card img {
          width: 100%;
          aspect-ratio: 2 / 3;
          object-fit: cover;
          display: block;
          margin-bottom: 10px;
     }
     .movie-card h2 {
          font-size: 1rem;
          color: #e8dcc8;
          margin-bottom: 4px;
     }
     .movie-card p {
          font-size: 0.85rem;
          color: #c4aa88;
     }
     </style>
              </head>

</html>
